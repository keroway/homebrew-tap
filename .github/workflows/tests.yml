name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # release asset の失効 (リンク切れ) を formula 未変更の期間でも検知する。
    # gitleaks (毎週月曜 00:17 UTC) / osv-scan (毎週月曜 06:00 UTC) とずらす。
    - cron: "0 3 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-bot:
    # matrix.include で container (digest 込み) を追加すると、既定の job 名
    # (matrix 全軸の値を連結したもの) にダイジェストが混入し、required status
    # check として使えなくなる (#84)。name を明示し matrix.os のみを使うことで
    # container の値をダイジェスト再ピン後も安定させる。
    name: test-bot (${{ matrix.os }})
    strategy:
      matrix:
        os: [ macos-15-intel, macos-26 ]
        include:
          # gmp (shellcheck の依存) に x86_64 macOS 向け bottle が存在せず
          # (homebrew-core 側が Intel mac 向け bottle ビルドを縮小済み)、
          # `brew style` の度に gmp のソースビルドが発生する。ソースビルドは
          # gmplib.org / ftpmirror.gnu.org への外部ネットワークアクセスを要するが、
          # macos-15-intel ランナーではこれが安定して繋がらず高頻度で失敗する
          # (#105、formula 側の問題ではない)。x86_64 バイナリを
          # 配る formula の install/test 自体は検証したいため job は残しつつ、
          # この既知の外部要因による失敗でブロックしないよう継続扱いにする。
          - os: macos-15-intel
            continue-on-error: true
          - os: ubuntu-latest
            container: ghcr.io/homebrew/brew@sha256:a82c987f23b4a955d879c4ec53ea74326e7ad86ca28da84747c959b336e4b358 # main, pinned 2026-08-24
          - os: ubuntu-24.04-arm
            container: ghcr.io/homebrew/brew@sha256:a82c987f23b4a955d879c4ec53ea74326e7ad86ca28da84747c959b336e4b358 # main, pinned 2026-08-24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    container: ${{ matrix.container }}
    continue-on-error: ${{ matrix.continue-on-error == true }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      # formula を実際に install して `test do` を走らせる唯一のステップ。
      # 副産物として bottle も作られるが、**この tap では bottle を公開していない**
      # (#37)。bottle だけを外す flag は brew test-bot に無いため、ステップ自体は
      # 残す。落とすと install/test の検証まで失われる。
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request' || github.event_name == 'push'

      # schedule 実行では push/pull_request と違い diff が空 (#89) になり、
      # 引数無しの --only-formulae は「テスト対象を検出できない」エラーで
      # 落ちる。schedule の目的 (release asset 失効の検知) を満たすには
      # tap 内の全 formula を明示的に指定する必要がある。
      #
      # `find Formula ...` は $GITHUB_WORKSPACE を基準にしていたが、この job には
      # `actions/checkout` が無く、setup-homebrew はリポジトリを $GITHUB_WORKSPACE
      # ではなく Homebrew の Taps ディレクトリ配下にチェックアウトするため、
      # $GITHUB_WORKSPACE に Formula/ が存在せず失敗していた (#102)。
      # setup-homebrew の `repository-path` 出力が指す実際のチェックアウト先を使う。
      - run: |
          find "$REPOSITORY_PATH/Formula" -maxdepth 1 -name '*.rb' -print0 \
            | xargs -0 -n1 basename \
            | sed 's/\.rb$//' \
            | xargs brew test-bot --only-formulae
        if: github.event_name == 'schedule'
        env:
          REPOSITORY_PATH: ${{ steps.set-up-homebrew.outputs.repository-path }}
