# 各リポジトリの .github/workflows/workflow-lint.yml に配置する呼び出し元。
name: workflow-lint

on:
  push:
    branches: [main]
  # PR は無条件で実行する。#52 で required status checks に登録するため、
  # paths フィルタ付きだと対象外の PR でワークフロー自体が起動せず
  # required check が常に pending のまま残ってしまう。
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: keroway/.github/.github/workflows/reusable-workflow-lint.yml@51a62605f203dab6f503a5f4279aed289458d873 # main, pinned 2026-08-24
