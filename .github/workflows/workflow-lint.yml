# 各リポジトリの .github/workflows/workflow-lint.yml に配置する呼び出し元。
name: workflow-lint

on:
  push:
    branches: [main]
  # PR は無条件で実行する。#52 で required status checks に登録するため、
  # paths フィルタ付きだと対象外の PR でワークフロー自体が起動せず
  # required check が常に pending のまま残ってしまう。
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: keroway/.github/.github/workflows/reusable-workflow-lint.yml@f46116661fa12e4ff3911c40970cf0f8510e9823 # v1.0.0
