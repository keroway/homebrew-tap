# lefthook config for keroway/tap
# Install: `brew install lefthook` && `lefthook install`
# Docs: https://lefthook.dev/

pre-commit:
  commands:
    brew-style:
      glob: "*.rb"
      run: brew style Formula/*.rb

pre-push:
  commands:
    tap-syntax:
      glob: "*.rb"
      run: brew test-bot --only-tap-syntax
