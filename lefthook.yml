# lefthook config for keroway/tap
# Install: `brew install lefthook` && `lefthook install`
# Docs: https://lefthook.dev/

pre-commit:
  commands:
    brew-style:
      glob: "*.rb"
      run: brew style Formula/*.rb

pre-push:
  commands:
    tap-syntax:
      glob: "*.rb"
      # brew test-bot は cwd に steps_output.txt を書き出す (#108 / #110)。cwd がリポジトリ
      # 直下だと作業ツリーに残留するため、justfile の check と同じく一時ディレクトリへ退避する。
      run: |
        tmp_dir=$(mktemp -d); (cd "$tmp_dir" && brew test-bot --only-tap-syntax); status=$?; rm -rf "$tmp_dir"; exit $status
